<a href="{{url}}" data-topic="{{topic}}" style="background: #FFFFFF; border: 1px solid #DCE1DE; border-radius: 26px; overflow: hidden; text-decoration: none; color: #1B2421; display: flex; flex-wrap: wrap">
<span style="flex: 1 1 460px; min-width: 0; min-height: 340px; box-sizing: border-box; padding: 36px; display: flex; flex-direction: column; justify-content: space-between; gap: 24px; background: linear-gradient(135deg, #E7F1EE 0%, #A9D8CC 100%); color: #0B3B32">
<svg aria-hidden="true" viewBox="10 12 80 72" style="width: 52px; height: 52px; box-sizing: border-box; padding: 12px 10px 10px; background: #0F6E5C; border-radius: 14px"><path d="M50 84 C22 66 10 50 10 34 C10 21 20 12 32 12 C40 12 46 16 50 23 C54 16 60 12 68 12 C80 12 90 21 90 34 C90 50 78 66 50 84 Z" fill="#FFFFFF"/><path d="M34 44 L45 55 L66 34" fill="none" stroke="#D92D20" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-size: 38px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">{{title}}</span>
</span>
<span style="flex: 1 1 360px; min-width: 0; padding: 36px; display: flex; flex-direction: column; gap: 12px; justify-content: center">
<span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #0F6E5C">{{topic}}</span>
<span style="font-size: 19px; color: #1B2421">{{summary}}</span>
<span style="font-size: 15px; color: #4A5752"><time datetime="{{date}}">{{date_text}}</time> · {{minutes}} min read</span>
<span style="font-weight: 800; color: #0F6E5C; margin-top: 6px">Read the article</span>
</span>
</a>
