<div style="margin: 0 0 34px; background: #FFFFFF; border: 2px solid #0F6E5C; border-radius: 26px; padding: 30px 34px; display: flex; flex-wrap: wrap; gap: 20px 32px; align-items: center">
<div style="flex: 1 1 380px; min-width: 0">
<p style="margin: 0 0 6px; font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #0F6E5C">{{label}}</p>
<p style="margin: 0 0 6px; font-size: 26px; line-height: 1.2; font-weight: 800; color: #0B3B32">{{title}}</p>
<p style="margin: 0; font-size: 17px; color: #4A5752">{{text}}</p>
</div>
<a href="{{file}}" download style="background: #0F6E5C; color: #FFFFFF; text-decoration: none; font-weight: 800; font-size: 18px; padding: 16px 26px; border-radius: 999px">{{button}}</a>
</div>
